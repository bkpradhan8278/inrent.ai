apiVersion: apps/v1
kind: Deployment
metadata:
  name: inrent-web
  labels: { app.kubernetes.io/name: inrent-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: inrent-web }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 25% }
  template:
    metadata:
      labels: { app.kubernetes.io/name: inrent-web }
    spec:
      securityContext:
        { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          # NEXT_PUBLIC_* values are compiled into this image at build time.
          image: ghcr.io/inrent/web:latest
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: inrent-config }
            - secretRef: { name: inrent-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            failureThreshold: 6
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: inrent-web
  labels: { app.kubernetes.io/name: inrent-web }
spec:
  selector: { app.kubernetes.io/name: inrent-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inrent-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: inrent-web }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
