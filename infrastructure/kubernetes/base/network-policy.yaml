# Default-deny ingress; only the ingress controller reaches web/gateway, and only web reaches the
# gateway internally. Egress stays open for upstream model providers, payments and email
# (restrict further with an egress gateway if your platform supports it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [inrent-web, inrent-gateway] }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: inrent-gateway }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: inrent-web }
      ports: [{ port: 8080 }]
