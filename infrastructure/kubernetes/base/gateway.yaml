apiVersion: apps/v1
kind: Deployment
metadata:
  name: inrent-gateway
  labels: { app.kubernetes.io/name: inrent-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: inrent-gateway }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 25% }
  template:
    metadata:
      labels: { app.kubernetes.io/name: inrent-gateway }
    spec:
      # Long streams need time to finish and bill before the pod exits.
      terminationGracePeriodSeconds: 60
      securityContext:
        { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: inrent-gateway } }
      containers:
        - name: gateway
          image: ghcr.io/inrent/gateway:latest
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: inrent-config }
            - secretRef: { name: inrent-secrets }
          env:
            - { name: GATEWAY_SHUTDOWN_GRACE_MS, value: "45000" }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: ["ALL"] },
            }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: inrent-gateway
  labels: { app.kubernetes.io/name: inrent-gateway }
spec:
  selector: { app.kubernetes.io/name: inrent-gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inrent-gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: inrent-gateway }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inrent-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: inrent-gateway }
