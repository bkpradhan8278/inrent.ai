apiVersion: apps/v1
kind: Deployment
metadata:
  name: inrent-worker
  labels: { app.kubernetes.io/name: inrent-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: inrent-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: inrent-worker }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/inrent/worker:latest
          envFrom:
            - configMapRef: { name: inrent-config }
            - secretRef: { name: inrent-secrets }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: ["ALL"] },
            }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
