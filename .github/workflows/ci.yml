name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
        continue-on-error: true # formatting is advisory; lint and types are enforced
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: inrent, POSTGRES_PASSWORD: inrent, POSTGRES_DB: inrent_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inrent" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://inrent:inrent@localhost:5432/inrent_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  migrations:
    name: Migration drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: inrent, POSTGRES_PASSWORD: inrent, POSTGRES_DB: inrent }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inrent" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://inrent:inrent@localhost:5432/inrent
      SHADOW_DATABASE_URL: postgresql://inrent:inrent@localhost:5432/inrent_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create shadow database
        run: PGPASSWORD=inrent psql -h localhost -U inrent -d inrent -c "CREATE DATABASE inrent_shadow"
      - name: Schema matches migrations
        run: pnpm --filter @inrent/db migrate:check
      - name: Migrations apply cleanly and seed is idempotent
        run: |
          pnpm db:migrate
          INRENT_ENV=development pnpm db:seed
          INRENT_ENV=development pnpm db:seed

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: https://staging.inrent.ai
      NEXT_PUBLIC_API_BASE_URL: https://api.staging.inrent.ai/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: sdks/python }
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  security:
    name: Secret scan & dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (secrets in history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - name: Dependency audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

  docker:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [checks]
    strategy:
      fail-fast: false
      matrix:
        target: [gateway, worker, web, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          tags: inrent/${{ matrix.target }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Trivy image scan (critical, fixable)
        if: matrix.target != 'migrate'
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: inrent/${{ matrix.target }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
